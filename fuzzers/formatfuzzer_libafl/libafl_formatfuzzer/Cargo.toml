[package]
name = "libafl_formatfuzzer"
version = "0.0.1"
authors = [
    "Andrea Fioraldi <andreafioraldi@gmail.com>",
    "Dominik Maier <domenukk@gmail.com>",
]
edition = "2021"

[features]
no_link_main = ["libafl_targets/libfuzzer_no_link_main"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = true

[profile.release-fuzzbench]
inherits = "release"
debug = false
strip = true

[dependencies]
libafl = "0.14"
libafl_bolts = "0.14"
libafl_targets = { version = "0.14", features = [
    "sancov_pcguard_hitcounts",
    "sancov_cmplog",
    "libfuzzer",
] }
libafl_cc = "0.14"
clap = { version = "4.0", features = ["default"] }
nix = { version = "0.29", features = ["fs"] }
mimalloc = { version = "*", default-features = false }
libloading = "0.8.6"
tempfile = "3.15.0"
serde = "1.0.217"

[lib]
crate-type = ["staticlib"]
