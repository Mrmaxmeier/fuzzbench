[mypy]
python_version = 3.10
mypy_path = .
explicit_package_bases = True
ignore_missing_imports = True
warn_unused_configs = True
check_untyped_defs = False
disallow_untyped_defs = False
allow_redefinition = True
# Match the historical gradually-typed style of this codebase.
strict_optional = False
show_error_codes = True

[mypy-third_party.*]
ignore_errors = True

[mypy-fuzzers.*]
ignore_errors = True

[mypy-benchmarks.*]
ignore_errors = True

[mypy-database.models]
# SQLAlchemy 1.4 declarative_base() is opaque to mypy without plugins.
disable_error_code = valid-type, misc
